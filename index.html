<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Atelier Vauquelin — Fine Watchmaking & Jewelry</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Geist:wght@300;400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>

<style>
/* ============ TOKENS ============ */
:root{
  --canvas:#0a0a0a; --surface:#131313; --surface-low:#1c1b1b; --surface-cont:#201f1f;
  --surface-high:#2a2a2a; --surface-lowest:#0e0e0e;
  --on-surface:#e5e2e1; --on-surface-variant:#d1c5b8; --outline:#998f83; --outline-variant:#4d463c;
  --primary:#e2c399; --primary-container:#c5a880; --on-primary:#402d0f; --secondary:#e9c349;
  --alabaster:#f9f8f6;
  --hairline:rgba(197,168,128,.18); --hairline-hover:rgba(212,175,55,.45);
  --gutter:2rem; --margin:4rem; --space-xs:.375rem; --space-sm:.75rem; --space-md:1.5rem; --space-lg:3rem; --space-xl:5rem;
  --font-display:'Playfair Display',serif; --font-body:'Geist',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--canvas);color:var(--on-surface);font-family:var(--font-body);font-size:.9375rem;line-height:1.6rem;letter-spacing:.01em;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none} img{display:block;max-width:100%;height:auto}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}

/* ============ TYPOGRAPHY ============ */
.display-hero{font-family:var(--font-display);font-size:5rem;font-weight:400;line-height:5.5rem;letter-spacing:-.02em}
.headline-lg{font-family:var(--font-display);font-size:3.25rem;font-weight:400;line-height:3.75rem;letter-spacing:-.015em}
.headline-md{font-family:var(--font-display);font-size:2rem;font-weight:400;line-height:2.5rem;letter-spacing:-.01em}
.headline-sm{font-family:var(--font-display);font-size:1.5rem;font-weight:500;line-height:2rem}
.title-editorial{font-family:var(--font-display);font-size:1.25rem;font-weight:400;line-height:1.75rem;letter-spacing:.02em}
.body-lg{font-size:1.125rem;font-weight:300;line-height:1.875rem}
.body-md{font-size:.9375rem;line-height:1.6rem}
.body-sm{font-size:.8125rem;line-height:1.35rem;letter-spacing:.02em}
.label-caps{font-size:.6875rem;font-weight:500;line-height:1rem;letter-spacing:.18em;text-transform:uppercase}
.technical-data{font-size:.75rem;line-height:1.2rem;letter-spacing:.05em}
.text-muted{color:var(--outline)} .text-primary{color:var(--primary-container)}
.text-alabaster{color:var(--alabaster)} .pre-line{white-space:pre-line}

/* ============ LAYOUT ============ */
.container{max-width:1440px;margin:0 auto;padding:0 var(--margin)}
.section{padding:var(--space-xl) 0;border-bottom:1px solid var(--hairline)}
.section:last-child{border-bottom:none}
.grid{display:grid;gap:var(--gutter)}
.grid-4{grid-template-columns:repeat(4,1fr)} .grid-3{grid-template-columns:repeat(3,1fr)} .grid-2{grid-template-columns:repeat(2,1fr)}
.grid-7-5{grid-template-columns:7fr 5fr} .grid-5-7{grid-template-columns:5fr 7fr}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-sm{gap:var(--space-sm)}.gap-md{gap:var(--space-md)}.gap-lg{gap:var(--space-lg)}

/* ============ HEADER ============ */
.site-header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--hairline)}
.nav-bar{display:flex;align-items:center;justify-content:space-between;padding:1.25rem var(--margin);max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1}
.brand-mark{font-family:var(--font-display);font-size:1.375rem;color:var(--alabaster)}
.brand-sub{font-size:.625rem;letter-spacing:.22em;text-transform:uppercase;color:var(--primary-container);margin-top:.25rem}
.nav-links{display:flex;gap:2.5rem;list-style:none}
.nav-link{font-size:.6875rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--on-surface-variant);position:relative;padding-bottom:.25rem;transition:color .2s}
.nav-link::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--primary-container);transition:width .3s}
.nav-link:hover,.nav-link.router-link-active{color:var(--alabaster)}
.nav-link:hover::after,.nav-link.router-link-active::after{width:100%}
.nav-cta{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.25rem;border:1px solid var(--primary-container);color:var(--alabaster);font-size:.6875rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;transition:all .2s}
.nav-cta:hover{border-color:var(--secondary);background:rgba(197,168,128,.08)}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:1rem 1.75rem;font-size:.6875rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;transition:all .2s;border-radius:0}
.btn-primary{background:var(--alabaster);color:var(--canvas)}
.btn-primary:hover{background:var(--primary-container);color:var(--on-primary)}
.btn-secondary{background:transparent;border:1px solid var(--primary-container);color:var(--alabaster)}
.btn-secondary:hover{border-color:var(--secondary);background:rgba(197,168,128,.08)}
.btn-text{padding:0;color:var(--primary-container);position:relative;display:inline-flex;align-items:center;gap:.25rem}
.btn-text::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:1px;background:var(--primary-container);transition:width .3s}
.btn-text:hover::after{width:100%}

/* ============ CARDS ============ */
.product-card{background:var(--surface-low);border:1px solid var(--hairline);overflow:hidden;transition:border-color .3s;display:flex;flex-direction:column}
.product-card:hover{border-color:var(--hairline-hover)}
.product-media{aspect-ratio:4/5;background:var(--surface-cont);overflow:hidden;position:relative}
.product-media img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.product-card:hover .product-media img{transform:scale(1.03)}
.product-tag{position:absolute;top:1rem;left:1rem;padding:.375rem .75rem;background:rgba(10,10,10,.7);backdrop-filter:blur(8px);color:var(--primary-container)}
.product-body{padding:1.5rem;display:flex;flex-direction:column;gap:.75rem;flex:1}
.product-title{font-family:var(--font-display);font-size:1.375rem;line-height:1.4;color:var(--alabaster)}
.product-footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:1rem;border-top:1px solid var(--hairline)}
.product-price{font-family:var(--font-display);font-size:1.125rem;color:var(--alabaster)}

/* ============ FORMS (public) ============ */
.form-field{position:relative;margin-bottom:2rem}
.form-input,.form-select,.form-textarea{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(197,168,128,.3);padding:1rem 0 .5rem;color:var(--alabaster);font-size:.9375rem;border-radius:0;transition:border-color .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-bottom-color:var(--primary-container)}
.form-label{position:absolute;left:0;top:1rem;font-size:.6875rem;letter-spacing:.18em;text-transform:uppercase;color:var(--outline);pointer-events:none;transition:all .2s}
.form-input:focus+.form-label,.form-input:not(:placeholder-shown)+.form-label,
.form-select:focus+.form-label,.form-select:valid+.form-label,
.form-textarea:focus+.form-label,.form-textarea:not(:placeholder-shown)+.form-label{top:-.25rem;font-size:.625rem;color:var(--primary-container)}
.form-select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path fill='%23c5a880' d='M6 8L0 0h12z'/></svg>");background-repeat:no-repeat;background-position:right 0 center;padding-right:1.5rem}
.form-select option{background:var(--surface-cont);color:var(--alabaster)}
.form-textarea{resize:vertical;min-height:6rem}
.form-check{display:flex;align-items:flex-start;gap:.75rem;cursor:pointer}
.form-check-box{width:14px;height:14px;border:1px solid var(--primary-container);flex-shrink:0;margin-top:.25rem;display:flex;align-items:center;justify-content:center}
.form-check input{display:none}
.form-check input:checked+.form-check-box{background:var(--primary-container)}
.form-check input:checked+.form-check-box::after{content:'';width:6px;height:6px;background:var(--canvas)}

/* ============ SPEC TABLE ============ */
.spec-table{width:100%;border-collapse:collapse}
.spec-table tr{border-bottom:1px solid rgba(255,255,255,.06)}
.spec-table td{padding:1rem 0;vertical-align:top}
.spec-table td:first-child{color:var(--primary-container);width:45%}
.spec-table td:last-child{text-align:right}

/* ============ HEROES ============ */
.hero{position:relative;min-height:90vh;display:flex;align-items:flex-end;padding:var(--space-xl) 0;overflow:hidden}
.hero-bg{position:absolute;inset:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;filter:brightness(.55)}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--canvas) 100%)}
.hero-content{position:relative;z-index:1;max-width:56rem}
.page-hero{padding:var(--space-xl) 0 var(--space-lg);border-bottom:1px solid var(--hairline)}

/* ============ FOOTER ============ */
.site-footer{background:var(--surface-lowest);border-top:1px solid var(--hairline);padding:var(--space-xl) 0 var(--space-lg)}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:var(--space-lg);margin-bottom:var(--space-lg)}
.footer-heading{color:var(--primary-container);margin-bottom:1.25rem}
.footer-list{list-style:none;display:flex;flex-direction:column;gap:.75rem}
.footer-list a{color:var(--on-surface-variant);transition:color .2s}
.footer-list a:hover{color:var(--alabaster)}
.newsletter-input{display:flex;border-bottom:1px solid var(--primary-container);margin-top:1rem}
.newsletter-input input{flex:1;background:transparent;border:none;padding:.75rem 0;color:var(--alabaster)}
.newsletter-input input:focus{outline:none}
.newsletter-input button{color:var(--primary-container);padding:0 .5rem}
.footer-bottom{padding-top:var(--space-md);border-top:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;color:var(--outline)}
.footer-legal{display:flex;gap:1.5rem;flex-wrap:wrap}

/* ============ MISC COMPONENTS ============ */
.salon-card{border:1px solid var(--hairline);padding:2rem;background:var(--surface-low);transition:border-color .3s}
.salon-card:hover{border-color:var(--hairline-hover)}
.salon-city{font-family:var(--font-display);font-size:1.75rem;color:var(--alabaster);margin:.25rem 0 1rem}
.salon-detail{display:flex;justify-content:space-between;gap:1rem;padding:.75rem 0;border-top:1px solid var(--hairline)}
.pillar-card{border:1px solid var(--hairline);background:var(--surface-low);overflow:hidden;display:flex;flex-direction:column}
.pillar-media{aspect-ratio:3/4;overflow:hidden}
.pillar-media img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.pillar-card:hover .pillar-media img{transform:scale(1.04)}
.pillar-body{padding:1.5rem;display:flex;flex-direction:column;gap:.75rem;flex:1}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gutter);counter-reset:phase}
.timeline-item{border-top:1px solid var(--primary-container);padding-top:1.5rem;counter-increment:phase}
.timeline-item::before{content:"0" counter(phase);font-family:var(--font-display);font-size:2rem;color:var(--primary-container);display:block;margin-bottom:1rem}
.dept-header{display:grid;grid-template-columns:1fr 2fr;gap:var(--space-lg);padding:var(--space-lg) 0;border-bottom:1px solid var(--hairline);align-items:end}
.dept-title{font-family:var(--font-display);font-size:2.5rem;color:var(--alabaster);margin-top:.75rem}
.stat-block{border-left:1px solid var(--primary-container);padding-left:1.5rem}
.stat-value{font-family:var(--font-display);font-size:2.5rem;color:var(--alabaster);line-height:1;margin-bottom:.5rem}
.eyebrow-rule{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;color:var(--primary-container)}
.eyebrow-rule::after{content:'';flex:1;height:1px;background:var(--hairline)}
.jump-link{color:var(--on-surface-variant);transition:color .2s;background:none}
.jump-link:hover{color:var(--alabaster)}
.guarantee-box{border:1px solid var(--hairline);background:var(--surface-low);padding:1.5rem;margin-top:2rem}

/* ============ DASHBOARD ============ */
.dash-layout{display:grid;grid-template-columns:230px 1fr;gap:var(--space-lg);padding:var(--space-lg) 0;min-height:70vh}
.sidebar{border-right:1px solid var(--hairline);padding-right:var(--space-md)}
.sidebar-title{color:var(--primary-container);margin-bottom:1.5rem}
.sidebar-link{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;font-size:.6875rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--on-surface-variant);border-left:1px solid transparent;transition:all .2s;margin-bottom:.25rem}
.sidebar-link:hover{color:var(--alabaster);background:rgba(197,168,128,.05)}
.sidebar-link.router-link-active{color:var(--alabaster);border-left-color:var(--secondary);background:rgba(197,168,128,.08)}
.savebar{position:sticky;top:78px;z-index:50;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border:1px solid var(--hairline);padding:.85rem 1.25rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.adm-card{border:1px solid var(--hairline);background:var(--surface-low);padding:1.75rem;margin-bottom:1.5rem}
.adm-card-title{font-family:var(--font-display);font-size:1.25rem;color:var(--alabaster);margin-bottom:.35rem}
.adm-card-sub{color:var(--outline);margin-bottom:1.5rem}
.adm-field{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.25rem}
.adm-label{font-size:.625rem;letter-spacing:.18em;text-transform:uppercase;color:var(--primary-container)}
.adm-input,.adm-textarea,.adm-select{background:var(--surface-cont);border:1px solid var(--outline-variant);padding:.75rem 1rem;color:var(--alabaster);font-size:.875rem;border-radius:0;transition:border-color .2s;width:100%}
.adm-input:focus,.adm-textarea:focus,.adm-select:focus{outline:none;border-color:var(--primary-container)}
.adm-textarea{resize:vertical;min-height:4.5rem}
.adm-select{appearance:none}
.adm-select option{background:var(--surface-cont)}
.adm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1.25rem}
.adm-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 1.25rem}
.adm-item{border:1px dashed var(--outline-variant);padding:1.25rem;margin-bottom:1rem;position:relative}
.adm-remove{position:absolute;top:.6rem;right:.6rem;color:var(--outline);font-size:1.1rem;padding:.25rem;transition:color .2s}
.adm-remove:hover{color:#ffb4ab}
.adm-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.1rem;border:1px solid var(--primary-container);color:var(--alabaster);font-size:.625rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;transition:all .2s;border-radius:0}
.adm-btn:hover{border-color:var(--secondary);background:rgba(197,168,128,.08)}
.adm-btn-solid{background:var(--alabaster);color:var(--canvas);border-color:var(--alabaster)}
.adm-btn-solid:hover{background:var(--primary-container);border-color:var(--primary-container);color:var(--on-primary)}
.adm-btn-danger{border-color:rgba(255,180,171,.4);color:#ffb4ab}
.adm-btn-danger:hover{border-color:#ffb4ab;background:rgba(255,180,171,.06)}
.adm-table{width:100%;border-collapse:collapse}
.adm-table th{text-align:left;padding:.75rem 0;color:var(--primary-container);border-bottom:1px solid var(--hairline);font-size:.625rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.adm-table td{padding:.9rem 0;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:middle}
.adm-thumb{width:52px;height:65px;object-fit:cover;border:1px solid var(--hairline)}
.preview-img{margin-top:.75rem;height:130px;width:100%;object-fit:cover;border:1px solid var(--hairline)}
.gate{min-height:70vh;display:flex;align-items:center;justify-content:center}
.gate-card{border:1px solid var(--hairline);background:var(--surface-low);padding:3rem;width:min(420px,100%);text-align:center}
.gate-card input{text-align:center;margin:1.5rem 0}
.toast{position:fixed;bottom:2rem;left:50%;transform:translate(-50%,120%);background:var(--alabaster);color:var(--canvas);padding:.9rem 1.75rem;font-size:.6875rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;z-index:999;transition:transform .35s ease;pointer-events:none}
.toast.show{transform:translate(-50%,0)}
.breadcrumb{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;color:var(--outline);margin-bottom:2.5rem}
.breadcrumb a:hover{color:var(--alabaster)}

/* ============ TRANSITIONS & RESPONSIVE ============ */
.fade-enter-active,.fade-leave-active{transition:opacity .25s ease}
.fade-enter-from,.fade-leave-to{opacity:0}
@media(max-width:1024px){
  :root{--margin:2.5rem}
  .display-hero{font-size:3.5rem;line-height:4rem}
  .headline-lg{font-size:2.5rem;line-height:3rem}
  .footer-grid{grid-template-columns:1fr 1fr}
  .timeline{grid-template-columns:repeat(2,1fr)}
  .dept-header,.grid-7-5,.grid-5-7{grid-template-columns:1fr}
  .grid-4{grid-template-columns:1fr 1fr}
}
@media(max-width:768px){
  :root{--margin:1.5rem;--space-xl:3rem}
  .display-hero{font-size:2.75rem;line-height:3.25rem}
  .headline-lg{font-size:2.25rem;line-height:2.75rem}
  .nav-links{display:none}
  .grid-3,.grid-2,.grid-4{grid-template-columns:1fr}
  .footer-grid,.timeline{grid-template-columns:1fr}
  .dash-layout{grid-template-columns:1fr}
  .sidebar{border-right:none;border-bottom:1px solid var(--hairline);padding:0 0 var(--space-md);display:flex;flex-wrap:wrap;gap:.5rem}
  .sidebar-title{width:100%}
  .adm-grid2,.adm-grid3{grid-template-columns:1fr}
  .hero{min-height:70vh}
}
</style>
</head>
<body>
<div id="app"></div>

<!-- ==================== HEADER ==================== -->
<script type="text/x-template" id="tpl-header">
<header class="site-header">
  <nav class="nav-bar">
    <router-link to="/" class="brand">
      <span class="brand-mark">{{ store.data.site.brand }}</span>
      <span class="brand-sub">{{ store.data.site.tagline }}</span>
    </router-link>
    <ul class="nav-links">
      <li><router-link to="/" class="nav-link">Home</router-link></li>
      <li><router-link to="/about" class="nav-link">About</router-link></li>
      <li><router-link to="/gallery" class="nav-link">Gallery</router-link></li>
      <li><router-link to="/contact" class="nav-link">Contact</router-link></li>
    </ul>
    <router-link to="/contact" class="nav-cta">Private Inquiry
      <span class="material-icons-outlined" style="font-size:1rem">north_east</span>
    </router-link>
  </nav>
</header>
</script>

<!-- ==================== FOOTER ==================== -->
<script type="text/x-template" id="tpl-footer">
<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <div class="brand" style="margin-bottom:1.5rem">
          <span class="brand-mark">{{ store.data.site.brand }}</span>
          <span class="brand-sub">Est. 1889 · Place Vendôme</span>
        </div>
        <p class="title-editorial text-muted" style="max-width:26rem">The Vauquelin Gazette — private monographs, seasonal watchmaking releases, and salon invitations dispatched directly to your private residence.</p>
        <form class="newsletter-input" @submit.prevent="toast('Subscribed to The Vauquelin Gazette.')">
          <input type="email" required placeholder="Your private correspondence"/>
          <button type="submit" class="material-icons-outlined">arrow_forward</button>
        </form>
      </div>
      <div>
        <h4 class="label-caps footer-heading">Private Salons</h4>
        <ul class="footer-list">
          <li v-for="s in store.data.contact.salons" :key="s.city"><span class="body-sm text-alabaster">{{ s.city }}</span><br/><span class="body-sm text-muted">{{ s.address.split(',')[0] }} · By appointment</span></li>
        </ul>
      </div>
      <div>
        <h4 class="label-caps footer-heading">House</h4>
        <ul class="footer-list">
          <li><router-link to="/about">About the House</router-link></li>
          <li><router-link to="/gallery">Gallery</router-link></li>
          <li><router-link to="/contact">Private Client Advisory</router-link></li>
        </ul>
      </div>
      <div>
        <h4 class="label-caps footer-heading">Liaison</h4>
        <ul class="footer-list">
          <li><a href="https://instagram.com" target="_blank" rel="noopener">Instagram / Journal</a></li>
          <li><a href="#">Fine Watchmaking Register</a></li>
          <li><a :href="'mailto:' + store.data.contact.liaison.email">{{ store.data.contact.liaison.email }}</a></li>
          <li><router-link to="/dashboard" class="text-primary">Dashboard</router-link></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <span class="body-sm">© 2025 Atelier Vauquelin. All rights reserved. Fine Watchmaking & Jewelry.</span>
      <div class="footer-legal body-sm"><a href="#">Confidentiality</a><a href="#">Provenance & Terms</a><a href="#">Certificates of Authenticity</a></div>
    </div>

    { id: 'p-veau', department: 'straps', ref: 'Annonay Tannery · Tawny', tag: 'French Calf', title: 'Epsom Calfskin — Tawny Tan', desc: 'Highly scratch-resistant stamped grain paired with a sweat-resistant French Zermatt calf interior.', price: '€ 380', image: IMG.s2, specs: [{ k: 'Thickness', v: '2.2mm Flat' }, { k: 'Buckle', v: '316L / 18k Option' }], note: 'IN STOCK · DISPATCHED IN 48H', href: 'https://external-checkout.com/vauquelin-strap-veau-epsom-fauve', ctaLabel: 'Acquire Piece' },
    { id: 'p-alligator', department: 'straps', ref: 'Matte Nubuck · CITES Cert.', tag: 'Exotic Reserve', title: 'Nubuck Alligator — Graphite', desc: 'Buffed top grain providing a soft cashmere handfeel. Delivered with an official international CITES passport.', price: '€ 680', image: IMG.s3, specs: [{ k: 'Padding', v: 'Hand-Skived' }, { k: 'Ends', v: 'Curved or Straight' }], note: 'LIMITED HIDE ALLOCATION', href: 'https://external-checkout.com/vauquelin-strap-alligator-nubuck-graphite', ctaLabel: 'Acquire Piece' }
  ]
};

/* ---------------- store ---------------- */
const STORAGE_KEY = 'vauquelin_cms_v1';
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      const base = clone(DEFAULTS);
      for (const k in saved) base[k] = saved[k];
      return base;
    }
  } catch (e) { console.warn('Registry unreadable; restoring defaults.', e); }
  return clone(DEFAULTS);
}
const store = reactive({ data: loadState() });
function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(store.data)); }

const DEPT_ORDER = ['rings', 'watches', 'straps'];
function productsByDept(key) { return store.data.products.filter(p => p.department === key); }

/* ---------------- shared field components ---------------- */
const FieldText = {
  props: ['label', 'modelValue'], emits: ['update:modelValue'],
  template: '<div class="adm-field"><span class="adm-label">{{ label }}</span><input class="adm-input" :value="modelValue" @input="$emit(\'update:modelValue\', $event.target.value)"/></div>'
};
const FieldArea = {
  props: ['label', 'modelValue'], emits: ['update:modelValue'],
  template: '<div class="adm-field"><span class="adm-label">{{ label }}</span><textarea class="adm-textarea" :value="modelValue" @input="$emit(\'update:modelValue\', $event.target.value)"></textarea></div>'
};
const FieldImage = {
  props: ['label', 'modelValue'], emits: ['update:modelValue'],
  template: `<div class="adm-field"><span class="adm-label">{{ label }}</span><input class="adm-input" :value="modelValue" @input="$emit('update:modelValue', $event.target.value)"/><img v-if="modelValue" class="preview-img" :src="modelValue" onerror="this.style.display='none'" onload="this.style.display='block'" alt="preview"/></div>`
};
const ListStrings = {
  props: ['label', 'modelValue'], emits: ['update:modelValue'],
  template: `<div class="adm-field" style="margin-top:1.25rem">
    <span class="adm-label">{{ label }}</span>
    <div v-for="(item, i) in modelValue" :key="i" style="display:flex;gap:.5rem;margin-bottom:.5rem">
      <input class="adm-input" :value="item" @input="$emit('update:modelValue', modelValue.map((v, x) => x === i ? $event.target.value : v))"/>
      <button class="adm-btn" @click="$emit('update:modelValue', modelValue.filter((_, x) => x !== i))"><span class="material-icons-outlined" style="font-size:1rem">close</span></button>
    </div>
    <button class="adm-btn" @click="$emit('update:modelValue', [...modelValue, ''])"><span class="material-icons-outlined" style="font-size:1rem">add</span>Add Option</button>
  </div>`
};

/* ---------------- site components ---------------- */
const AppHeader = { template: '#tpl-header', setup() { return { store }; } };
const AppFooter = { template: '#tpl-footer', setup() { return { store, toast }; } };
const ProductCard = { props: ['product'], template: '#tpl-product-card' };

const HomePage = { template: '#tpl-home', setup() { return { home: computed(() => store.data.home) }; } };

const GalleryPage = {
  template: '#tpl-gallery',
  setup() {
    const departments = computed(() => DEPT_ORDER.map(key => ({ key, meta: store.data.departments[key], items: productsByDept(key) })));
    const scrollToDept = key => document.getElementById('dept-' + key)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return { departments, scrollToDept };
  }
};

const ProductPage = {
  template: '#tpl-product',
  setup() {
    const route = VueRouter.useRoute();
    const product = computed(() => store.data.products.find(p => p.id === route.params.id));
    const deptMeta = computed(() => product.value ? store.data.departments[product.value.department] : { name: '' });
    const related = computed(() => product.value ? store.data.products.filter(p => p.department === product.value.department && p.id !== product.value.id).slice(0, 3) : []);
    return { product, deptMeta, related };
  }
};

const AboutPage = { template: '#tpl-about', setup() { return { about: computed(() => store.data.about) }; } };

const ContactPage = {
  template: '#tpl-contact',
  setup() {
    const form = reactive({ name: '', email: '', phone: '', discipline: '', salon: '', timeline: '', vision: '', consent: false });
    const submit = () => {
      toast('Dossier Received — Forwarded to the Salon. Confirmation #VQ-' + Date.now().toString(36).toUpperCase());
      Object.assign(form, { name: '', email: '', phone: '', discipline: '', salon: '', timeline: '', vision: '', consent: false });
    };
    return { contact: computed(() => store.data.contact), form, submit };
  }
};

/* ---------------- dashboard components ---------------- */
function sectionEditor(sectionName, sectionLabel) {
  return {
    template: '#tpl-dash-' + sectionName,
    data() { return { draft: clone(store.data[sectionName]) }; },
    methods: {
      save() { store.data[sectionName] = clone(this.draft); persist(); toast(sectionLabel + ' published to the site.'); },
      discard() { this.draft = clone(store.data[sectionName]); toast('Changes discarded.'); }
    }
  };
}
const DashHome = sectionEditor('home', 'Home page');
const DashAbout = sectionEditor('about', 'About page');
const DashContact = sectionEditor('contact', 'Contact page');

const DashLayout = {
  template: '#tpl-dash',
  data() { return { unlocked: sessionStorage.getItem('vq_console') === '1', code: '' }; },
  methods: {
    unlock() {
      if (this.code === 'vauquelin') { sessionStorage.setItem('vq_console', '1'); this.unlocked = true; toast('Vault unlocked. Welcome.'); }
      else toast('Incorrect passcode. The vault remains sealed.');
    }
  }
};

const DashProducts = {
  template: '#tpl-dash-products',
  setup() {
    const deptName = key => store.data.departments[key]?.name || key;
    const setDept = (key, field, value) => { store.data.departments[key][field] = value; persist(); };
    const remove = p => { if (confirm('Remove "' + p.title + '" from the registry permanently?')) { store.data.products = store.data.products.filter(x => x.id !== p.id); persist(); toast('Piece removed from the registry.'); } };
    return { store, deptOrder: DEPT_ORDER, departments: store.data.departments, deptName, setDept, remove };
  }
};

const DashProductForm = {
  template: '#tpl-dash-product-form',
  setup() {
    const route = VueRouter.useRoute();
    const router = VueRouter.useRouter();
    const isNew = !route.params.id;
    const source = isNew ? null : store.data.products.find(p => p.id === route.params.id);
    const draft = reactive(clone(source || { id: uid(), department: 'rings', ref: '', tag: '', title: '', desc: '', price: '', image: '', specs: [], note: '', href: '', ctaLabel: 'Acquire Piece' }));
    const save = () => {
      if (!draft.title.trim()) { toast('A title is required for registration.'); return; }
      if (isNew) store.data.products.push(clone(draft));
      else { const i = store.data.products.findIndex(p => p.id === draft.id); store.data.products[i] = clone(draft); }
      persist(); toast(isNew ? 'Piece registered in the gallery.' : 'Piece specifications updated.');
      router.push('/dashboard/products');
    };
    return { draft, isNew, save, deptOrder: DEPT_ORDER, departments: store.data.departments };
  }
};

/* ---------------- router & app ---------------- */
const routes = [
  { path: '/', component: HomePage },
  { path: '/gallery', component: GalleryPage },
  { path: '/gallery/:id', component: ProductPage },
  { path: '/about', component: AboutPage },
  { path: '/contact', component: ContactPage },
  { path: '/dashboard', component: DashLayout, children: [
    { path: '', redirect: '/dashboard/home' },
    { path: 'home', component: DashHome },
    { path: 'about', component: DashAbout },
    { path: 'contact', component: DashContact },
    { path: 'products', component: DashProducts },
    { path: 'products/new', component: DashProductForm },
    { path: 'products/:id', component: DashProductForm }
  ]},
  { path: '/:pathMatch(.*)*', redirect: '/' }
];

const router = createRouter({
  history: createWebHashHistory(),
  routes,
  scrollBehavior(to) { return to.hash ? {} : { top: 0, behavior: 'instant' }; }
});

const App = {
  template: '#tpl-app',
  setup() { return { toastState }; }
};

const app = createApp(App);
app.component('app-header', AppHeader);
app.component('app-footer', AppFooter);
app.component('product-card', ProductCard);
app.component('field-text', FieldText);
app.component('field-area', FieldArea);
app.component('field-image', FieldImage);
app.component('list-strings', ListStrings);
app.use(router);
app.mount('#app');
</script>
</body>
</html>
